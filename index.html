<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A71B9" />
  <title>Такси XXI — Маршрут здоровья</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card">
      <header class="topbar">
        <div class="brand">
          <img src="assets/logo.png" alt="Медицинский центр XXI век" class="brand-logo" />
          <div>
            <div class="brand-title">Такси XXI</div>
            <div class="brand-subtitle">Маршрут здоровья</div>
          </div>
        </div>
        <button id="soundBtn" class="icon-btn" aria-label="Звук">🔊</button>
      </header>

      <div class="hud">
        <div class="hud-pill"><span>Счёт</span><strong id="score">0</strong></div>
        <div class="hud-pill"><span>Цель</span><strong id="lives">10 XXI</strong></div>
        <div class="hud-pill"><span>Жетоны</span><strong id="tokens">0</strong></div>
      </div>

      <section class="stage-wrap">
        <div id="stage" class="stage">
          <canvas id="gameCanvas"></canvas>
          <div id="overlay" class="overlay show">
            <div class="overlay-card">
              <img src="assets/logo.png" alt="" class="overlay-logo" />
              <h1>Такси XXI</h1>
              <p>Соберите 10 жетонов XXI. Столкновение с конусом сразу завершает игру.</p>
              <button id="startBtn" class="primary-btn">В путь</button>
              <div class="controls-note">Свайп влево/вправо или клавиши ← →</div>
            </div>
          </div>
        </div>
      </section>

      <div class="mission">
        <div>
          <div class="mission-label">Цель маршрута</div>
          <div class="mission-title">Соберите 10 жетонов XXI</div>
        </div>
        <div class="mission-progress"><span id="missionProgress">0/10</span></div>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
